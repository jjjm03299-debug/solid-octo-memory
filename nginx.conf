load_module modules/ngx_http_js_module.so;

events {}

http {
    include mime.types;
    default_type application/octet-stream;

    js_import /etc/nginx/cards.js;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Serve frontend dashboard
        location / {
            try_files $uri $uri/ =404;
        }

        # API Key Generation / Listing public endpoints can be open or token-secured
        location = /api/api-keys {
            if ($request_method = POST) { js_content cards.createApiKey; }
            if ($request_method = GET)  { js_content cards.listApiKeys; }
        }

        location ~ ^/api/api-keys/(.+) {
            if ($request_method = DELETE) { js_content cards.deleteApiKey; }
        }

        # Secure remaining card/cardholder endpoints with dynamic Authorization validation
        location /api/ {
            # Basic structural guard ensuring a Bearer sk_live token is present
            if ($http_authorization !~ "^Bearer sk_live_[a-zA-Z0-9]+$") {
                return 401 '{"error": {"message": "Invalid or missing live secret key format (sk_live_)", "type": "invalid_request_error"}}';
            }
            client_max_body_size 10k;
        }

        location = /api/cardholders {
            if ($request_method = POST) { js_content cards.createCardholder; }
            if ($request_method = GET)  { js_content cards.listCardholders; }
        }

        location ~ ^/api/cardholders/(.+) {
            if ($request_method = DELETE) { js_content cards.deleteCardholder; }
        }

        location = /api/cards {
            if ($request_method = POST) { js_content cards.generateCard; }
            if ($request_method = GET)  { js_content cards.listCards; }
        }

        location = /api/cards/retrieve {
            if ($request_method = GET)  { js_content cards.retrieveCard; }
        }

        location ~ ^/api/cards/(.+) {
            if ($request_method = DELETE) { js_content cards.deleteCard; }
        }
    }
}
